name: CI/CD - Sistema de Metas Vendas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hildebrandobatista-h3/sistema-metas-vendas

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: metas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run Unit Tests (Vitest)
        working-directory: ./frontend
        run: npm run test
        continue-on-error: false

      - name: Run E2E Tests (Cypress)
        working-directory: ./frontend
        run: npm run test:e2e
        continue-on-error: false

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            ./frontend/coverage
            ./frontend/cypress/videos
          retention-days: 7

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Deployment Webhook
        uses: joelwmacey/actions-http-request@master
        with:
          url: 'https://${{ secrets.VPS_HOST }}:9000/webhook/deploy'
          method: 'POST'
          headers: '{"Authorization": "Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}", "Content-Type": "application/json"}'
          data: '{"branch": "main", "commit": "${{ github.sha }}", "actor": "${{ github.actor }}"}'
          insecure: true

      - name: Wait for Deployment
        run: sleep 30

      - name: Verify Deployment Health
        run: |
          for i in {1..5}; do
            if curl -f -s https://${{ secrets.VPS_HOST }}:8000/health > /dev/null; then
              echo "✓ Deployment healthy"
              exit 0
            fi
            echo "Attempt $i/5 - waiting for service..."
            sleep 10
          done
          echo "✗ Deployment health check failed"
          exit 1

      - name: Post Success to GitHub
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ needs.build.outputs.deployment_id || 0 }},
              state: 'success',
              environment_url: 'https://${{ secrets.VPS_HOST }}:8000',
              description: 'Deployment successful'
            })

      - name: Post Failure to GitHub
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ needs.build.outputs.deployment_id || 0 }},
              state: 'failure',
              description: 'Deployment failed - check VPS logs'
            })

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    if: always()
    needs: [test, build, deploy]

    steps:
      - name: Determine Status
        id: status
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "status=Tests failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build.result }}" = "failure" ]; then
            echo "status=Build failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "status=Deploy failed" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status=All passed" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          fi

      - name: Log Final Status
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║  CI/CD Pipeline: ${{ steps.status.outputs.status }}  ║"
          echo "║  Commit: ${{ github.sha }}  ║"
          echo "╚════════════════════════════════════════╝"
